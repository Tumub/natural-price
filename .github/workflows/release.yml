name: release
on:
  push:
    tags: ['v*']
jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Set the NP_SERVICE_URL repository variable to the public fetch-service origin before tagging.
      # No NP_SERVER_ENABLED: released builds have the server compiled out.
      - run: npm run build:extension && npm run package
      - run: npm run build:extension:firefox && npm run package:firefox
      - run: gh release create "$GITHUB_REF_NAME" natural-price-extension-*.zip --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
