# Natural Price: both services behind Caddy with automatic TLS.
# Copy .env.example to .env, set the values, then: docker compose up -d
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      NP_DOMAIN: ${NP_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [fetch, crowd]

  fetch:
    build: { context: .., dockerfile: packages/fetch-service/Dockerfile }
    restart: unless-stopped
    environment:
      PORT: 8787
      NP_ALLOWED_HOSTS: ${NP_ALLOWED_HOSTS:-ikea.com,mediamarkt.ch,nike.com,booking.com}
      NP_EXITS: ${NP_EXITS:-direct}
      NP_FETCHES_PER_CHECK: ${NP_FETCHES_PER_CHECK:-1}
      NP_CONCURRENCY: ${NP_CONCURRENCY:-2}
      NP_CROWD_URL: http://crowd:8788
      NP_STATS_FILE: /data/stats.json
    volumes: [fetch-data:/data]
    # Chromium needs more than the default 64 MB of shared memory.
    shm_size: 512m
    mem_limit: 1500m

  crowd:
    build: { context: .., dockerfile: packages/crowd-api/Dockerfile }
    restart: unless-stopped
    environment:
      PORT: 8788
      NP_CROWD_DB: /data/crowd.sqlite
      NP_CROWD_SECRET: ${NP_CROWD_SECRET:?set NP_CROWD_SECRET in .env}
      NP_ALLOWED_HOSTS: ${NP_ALLOWED_HOSTS:-ikea.com,mediamarkt.ch,nike.com,booking.com}
    volumes: [crowd-data:/data]
    mem_limit: 256m

volumes:
  caddy-data:
  caddy-config:
  fetch-data:
  crowd-data:
